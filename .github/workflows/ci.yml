name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      SEOUL_OPEN_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt ruff==0.12.0 pip-audit==2.10.1

      - name: Assert live API credential is absent
        run: test -z "${SEOUL_OPEN_API_KEY:-}"

      - name: Run network-free tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff checks
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Check installed dependencies
        run: python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
